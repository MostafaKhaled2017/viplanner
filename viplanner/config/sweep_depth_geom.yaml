base_config: viplanner/config/train.yaml
output_root: logs/tuning/depth_geom_moderate
seed: 0
max_trials: 32

defaults:
  epochs: 80
  early_stop_patience: 12
  patience: 5
  factor: 0.5
  min_lr: 0.00001
  seed: 0
  sem: false
  rgb: false
  cost_map_name: cost_map_geom

fixed:
  optimizer: sgd
  momentum: 0.1
  w_decay: 0.0001
  decoder_small: false
  hierarchical: false

grid:
  lr:
    - 0.0005
    - 0.001
    - 0.002
    - 0.005
  batch_size:
    - 16
    - 32
  w_obs:
    - 0.25
    - 0.5
    - 1.0
  w_height:
    - 1.0
    - 1.5
  w_motion:
    - 1.0
    - 1.5
    - 2.0
  w_goal:
    - 3.0
    - 4.0
    - 5.0
  data_cfg.distance_scheme:
    - 1: 0.30
      5: 0.35
      10: 0.20
      15: 0.10
      20: 0.05
    - 1: 0.20
      5: 0.35
      10: 0.25
      15: 0.15
      20: 0.05
    - 1: 0.15
      5: 0.25
      10: 0.30
      15: 0.20
      20: 0.10
