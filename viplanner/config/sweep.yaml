base_config: viplanner/config/train.yaml
output_root: logs/tuning/depth_geom_moderate
seed: 4
max_trials: 200

fixed:
  resume: true
  resume_model_path: viplanner/checkpoint

grid:
  freeze_layers:
    - 0
    - 3
    - 5
  lr:
    - 0.0005
    - 0.001
    - 0.002
  batch_size:
    - 64
    - 128
  fear_ahead_dist:
    - 5.0
    - 7.0
  data_cfg.max_depth:
    - 15.0
    - 30.0
  data_cfg.distance_scheme:
    - 1: 0.30
      5: 0.35
      10: 0.20
      15: 0.10
      30: 0.05
    - 1: 0.20
      5: 0.35
      10: 0.25
      15: 0.15
      30: 0.05
    - 1: 0.15
      5: 0.25
      10: 0.30
      15: 0.20
      30: 0.10
  w_obs:
    - 0.5
    - 0.75
    - 1.0
  # w_height:
  #   - 1.0
  #   - 1.5
  # w_motion:
  #   - 1.0
  #   - 1.5
  #   - 2.0
  # w_goal:
  #   - 3.0
  #   - 4.0
  #   - 5.0

